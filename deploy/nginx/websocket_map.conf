# websocket_map.conf — WebSocket upgrade 判定用 map 変数
#
# 設置先: /etc/nginx/conf.d/websocket_map.conf
# (setup.sh が自動的に設置する)
#
# pi5.conf の proxy_set_header Connection $connection_upgrade; で参照される。
#
# 動作:
#   Upgrade ヘッダあり (WS upgrade リクエスト) → Connection: upgrade
#   Upgrade ヘッダなし (通常 HTTP リクエスト)  → Connection: close
#
# これにより voice-gateway / dashboard の同一 location で HTTP と WebSocket を
# 正しく両立できる (Connection: "upgrade" 固定にすると通常 HTTP リクエストが
# 意図しない Connection ヘッダを upstream に送信してしまう)。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
