# agent-hub Pi5 — nginx reverse proxy
# 対象サービス:
#   https://<Pi5>:443   → voice-gateway     (:8765)  ← iPhone 音声 UI
#   https://<Pi5>:8443  → agent-hub-dashboard (:8080) ← 管理画面
#   http://<Pi5>:80     → 443 へ redirect
#
# 設置方法:
#   sudo cp deploy/nginx/pi5.conf /etc/nginx/sites-available/pi5-agent-hub
#   sudo ln -sf /etc/nginx/sites-available/pi5-agent-hub \
#               /etc/nginx/sites-enabled/pi5-agent-hub
#   sudo nginx -t && sudo systemctl reload nginx
#
# 証明書の生成 (初回のみ):
#   bash deploy/nginx/gen-certs.sh [Pi5のホスト名 例: raspberrypi.local]
#
# 詳細: docs/https-setup.md

##############################################################################
# voice-gateway  (HTTPS 443 → :8765)
# iOS Safari の getUserMedia() は secure context 必須のため HTTPS で提供
##############################################################################
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # IP アドレス / mDNS 名 いずれでもアクセス可

    ssl_certificate     /etc/ssl/agent-hub/pi5.crt;
    ssl_certificate_key /etc/ssl/agent-hub/pi5.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # セキュリティヘッダ
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # voice-gateway — HTTP + WebSocket を同一 location で処理
    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket は長時間接続 (音声セッション中は切れないように)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # バッファを無効化して音声パケットを即時転送
        proxy_buffering     off;
        proxy_cache         off;
    }
}

##############################################################################
# agent-hub-dashboard  (HTTPS 8443 → :8080)
##############################################################################
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/agent-hub/pi5.crt;
    ssl_certificate_key /etc/ssl/agent-hub/pi5.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

##############################################################################
# HTTP → HTTPS リダイレクト (port 80)
##############################################################################
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}
